name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Create release artifact
        run: |
          zip -r "ai-radar-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" \
            ".venv/*" \
            "__pycache__/*" \
            ".pytest_cache/*"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ai-radar-${{ github.ref_name }}"
          path: "ai-radar-${{ github.ref_name }}.zip"